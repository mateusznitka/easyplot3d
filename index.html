<title>Działka 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Układ: szyna narzędzi | scena 3D | panel właściwości — jak stół kreślarski z makietą na środku */
:root{
  --bg:#eef0ea; --surface:#ffffff; --surface-2:#f6f7f3; --ink:#1c2420; --muted:#65706a; --line:#d6dbd2;
  --accent:#23664f; --accent-ink:#ffffff; --accent-soft:#dcebe3; --marker:#d45a22; --danger:#b53a2a;
  --f-display:"Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121714; --surface:#1a211d; --surface-2:#202823; --ink:#e4e9e3; --muted:#97a39b; --line:#2d3631;
  --accent:#5db893; --accent-ink:#0d1a14; --accent-soft:#1f3a2e; --marker:#f07a3e; --danger:#ef7a68; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121714; --surface:#1a211d; --surface-2:#202823; --ink:#e4e9e3; --muted:#97a39b; --line:#2d3631;
  --accent:#5db893; --accent-ink:#0d1a14; --accent-soft:#1f3a2e; --marker:#f07a3e; --danger:#ef7a68; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100%;display:grid;grid-template-columns:76px minmax(0,1fr) 312px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top top" "rail stage panel"}
.top{grid-area:top;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;margin-right:4px}
.brand small{font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--ink);border:0;cursor:pointer}
.chip b{font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.panel .seg button{padding:6px 4px;font-size:12.5px}
.grow{flex:1}
.sun{display:flex;align-items:center;gap:8px;font-size:13px}
.sun select{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 4px}
.sun input[type=range]{width:120px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.iconbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:13px}
.iconbtn:disabled{opacity:.4;cursor:default}
.toggle{display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;color:var(--muted)}
.toggle input{accent-color:var(--accent)}

.rail{grid-area:rail;display:flex;flex-direction:column;gap:2px;padding:8px 6px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto}
.rail button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border:0;border-radius:var(--r);background:none;cursor:pointer;color:var(--muted);font-size:11px;line-height:1.1}
.rail button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rail button:hover{background:var(--surface-2);color:var(--ink)}
.rail button.on{background:var(--accent-soft);color:var(--ink)}
.rail button.on svg{stroke:var(--accent)}
.rail .sep{height:1px;background:var(--line);margin:6px 8px}

.stage{grid-area:stage;position:relative;min-width:0;min-height:0}
#viewport{position:absolute;inset:0;touch-action:none}
#viewport canvas{display:block;width:100%;height:100%}
.hud{position:absolute;pointer-events:none;font-size:12px}
.hint{top:10px;left:10px;right:70px;color:#1c2420;text-shadow:0 0 6px rgba(255,255,255,.85)}
.hint span{background:rgba(255,255,255,.78);padding:4px 9px;border-radius:6px;display:inline-block;max-width:100%}
.coords{left:10px;bottom:10px;background:rgba(20,26,23,.72);color:#e9eee8;padding:4px 9px;border-radius:6px;font-family:var(--f-mono)}
.compass{right:12px;top:10px;width:48px;height:48px}
.compass svg{width:100%;height:100%;transition:transform .08s linear}
.walkpad{position:absolute;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:6px}
.walkpad button{border:0;border-radius:10px;background:rgba(20,26,23,.6);color:#fff;font-size:18px;touch-action:none}
.walkpad .exit{grid-column:1/4;grid-row:auto;height:34px;font-size:13px}
.toast{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:8px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.embar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.18);z-index:5;max-width:calc(100% - 20px);overflow-x:auto}
.embar button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;border-radius:7px;padding:5px 8px;cursor:pointer;color:var(--muted);font-size:11px;line-height:1.1;white-space:nowrap}
.embar button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.embar button:hover{background:var(--surface-2);color:var(--ink)}
.embar button.on{background:var(--accent-soft);color:var(--ink)}
.embar button.on svg{stroke:var(--accent)}
.embar .sep{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
.embar .done{background:var(--accent);color:var(--accent-ink);font-size:13px;padding:8px 12px}
.embar .done:hover{background:var(--accent);color:var(--accent-ink);filter:brightness(1.08)}
.embar .cancel{font-size:13px;padding:8px 10px}
body.em .rail{opacity:.4;pointer-events:none}
body.em .hint{top:68px}
.rtypes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.rtypes button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);cursor:pointer;font-size:11.5px}
.rtypes svg{width:44px;height:22px;fill:var(--muted);stroke:var(--ink);stroke-width:1;stroke-linejoin:round}
.rtypes button.on{border-color:var(--accent);background:var(--accent-soft)}
.rtypes button.on svg{fill:var(--accent)}
@media (max-width:760px){ .embar button span{display:none} .embar button{padding:6px} .embar .done,.embar .cancel{padding:7px 9px} }

.panel{grid-area:panel;border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;min-width:0}
.panel-inner{padding:16px;display:flex;flex-direction:column;gap:16px}
.panel h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
.panel p{margin:0;color:var(--muted);font-size:13px}
.panel .lead{color:var(--ink)}
.field{display:flex;flex-direction:column;gap:4px}
.field label,.flabel{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.field label output{font-family:var(--f-mono);color:var(--ink)}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input[type=number],input[type=text],select.inp{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-family:var(--f-mono);font-size:13px}
input[type=color]{width:100%;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:2px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-size:13px;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .btn{flex:1 1 auto}
.cat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);cursor:pointer}
.cat button b{font-weight:500;font-size:13px;line-height:1.2}
.cat button small{font:11px var(--f-mono);color:var(--muted)}
.cat button img{width:100%;aspect-ratio:4/3;object-fit:contain;border-radius:5px;background:var(--bg);margin-bottom:4px}
.cat button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.swatches button{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:var(--r);padding:4px;background:var(--surface-2);cursor:pointer;font-size:11px;line-height:1.2;text-align:left}
.swatches button i{display:block;height:34px;border-radius:5px;background-size:auto 100%}
.swatches button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kbd{font:11px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:12px;color:var(--muted);align-items:center}
.big{font:500 30px var(--f-mono);color:var(--ink);letter-spacing:-.02em}
.seglist{display:flex;flex-direction:column;gap:3px;font-size:13px}
.seglist div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.check input{accent-color:var(--accent)}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.note{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}
a{color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal>div{background:var(--surface);border-radius:12px;padding:18px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.modal textarea{width:100%;height:200px;font:12px var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;color:var(--ink)}

@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "stage" "panel" "rail"}
  .top{gap:8px;padding:6px 10px}
  .rail{flex-direction:row;border-right:0;border-top:1px solid var(--line);overflow-x:auto;padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
  .rail button{min-width:58px}
  .rail .sep{display:none}
  .panel{border-left:0;border-top:1px solid var(--line);max-height:38vh}
  .panel.collapsed{max-height:44px;overflow:hidden}
  .panel-inner{padding:12px 14px}
  .hide-sm,.hint,.brand small,.top .grow{display:none}
  .sun{flex:1}
  .sun input[type=range]{flex:1;width:auto}
}
@media (min-width:761px){ .only-sm{display:none} }
@media (prefers-reduced-motion:reduce){ .toast,.compass svg{transition:none} }
</style>

<div id="app">
  <header class="top">
    <div class="brand">Działka 3D <small>v13</small></div>
    <button class="chip" id="exampleChip" hidden title="Otwórz panel Projekt">Przykładowa działka · <b>zacznij od zera</b></button>
    <div class="seg" id="viewSeg" role="group" aria-label="Widok">
      <button data-view="orbit" class="on">3D</button><button data-view="top">Z góry</button><button data-view="walk">Spacer</button>
    </div>
    <div class="grow"></div>
    <div class="sun" title="Pozycja słońca dla Polski centralnej (52°N)">
      <select id="month" aria-label="Miesiąc"></select>
      <input type="range" id="hour" min="4" max="22" step="0.25" aria-label="Godzina">
      <span class="mono" id="hourOut">14:00</span>
      <span class="mono hide-sm" id="sunOut" style="color:var(--muted)"></span>
    </div>
    <label class="toggle hide-sm"><input type="checkbox" id="gridT" checked> Siatka</label>
    <label class="toggle hide-sm"><input type="checkbox" id="shadowT" checked> Cienie</label>
    <button class="iconbtn" id="undoB" title="Cofnij (Ctrl+Z)" disabled>↶</button>
    <button class="iconbtn" id="redoB" title="Ponów (Ctrl+Y)" disabled>↷</button>
  </header>

  <nav class="rail" id="rail" aria-label="Narzędzia"></nav>

  <main class="stage">
    <div id="viewport"></div>
    <div class="hud hint" id="hint"><span></span></div>
    <div class="embar" id="emBar" hidden></div>
    <div class="hud coords" id="coords">—</div>
    <div class="hud compass" title="Północ">
      <svg viewBox="-24 -24 48 48" id="compassSvg"><circle r="21" fill="rgba(20,26,23,.62)"/><path d="M0 -16 L6 2 L0 -2 L-6 2Z" fill="#f07a3e"/><path d="M0 16 L6 2 L0 -2 L-6 2Z" fill="#cfd6cf"/></svg>
    </div>
    <div class="walkpad" id="walkpad" hidden>
      <span></span><button data-k="KeyW" aria-label="Naprzód">▲</button><span></span>
      <button data-k="KeyA" aria-label="W lewo">◀</button><button data-k="KeyS" aria-label="Wstecz">▼</button><button data-k="KeyD" aria-label="W prawo">▶</button>
      <button class="exit" id="walkExit">Zakończ spacer</button>
    </div>
    <div class="toast" id="toast"></div>
  </main>

  <aside class="panel" id="panel"><div class="panel-inner" id="panelInner"></div></aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
const DEG = Math.PI/180;
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const fm = (v, d=1) => Number(v).toLocaleString('pl-PL', {minimumFractionDigits:d, maximumFractionDigits:d});
function rng(seed){ let a = seed>>>0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function shade(hex, amt){ const c=new THREE.Color(hex); const hsl={}; c.getHSL(hsl); c.setHSL(hsl.h, hsl.s, clamp(hsl.l+amt,0,1)); return '#'+c.getHexString(); }

/* ---------------- stan ---------------- */
const S = { W:36, D:48, step:0.5, nx:0, nz:0, heights:null, items:[], boundary:{pts:[], closed:false}, bg:null, textures:{}, nextId:1, example:false };
let detailPref='detail'; try{ detailPref=localStorage.getItem('dzialka3d.detail')||'detail'; }catch(_){}
const UI = { detail:detailPref, wing:0, pushMode:'whole', pushW:3, bmode:'bryly', op:-1, opKind:'window', finish:'wood', tool:'select', terrainMode:'raise', radius:3, strength:0.5, setH:0, surf:'kostka', paintMode:'brush', paintR:1, paintSoft:0.35, paintOp:1, pathW:1.3, placeType:null, sel:null, view:'orbit', month:new Date().getMonth(), hour:14, grid:true, shadows:true, lastMeasure:null };
let ppm = 32;

/* ---------------- three ---------------- */
const viewport = $('#viewport');
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
viewport.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#bcd3e6');
scene.fog = new THREE.Fog('#bcd3e6', 150, 600);
const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 3000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = false;
controls.screenSpacePanning = false;
controls.maxPolarAngle = Math.PI*0.49;
controls.minDistance = 2; controls.maxDistance = 800;
controls.mouseButtons = {LEFT:-1, MIDDLE:THREE.MOUSE.PAN, RIGHT:THREE.MOUSE.ROTATE};
const hemi = new THREE.HemisphereLight('#dfeaf5', '#5d5a45', 0.55); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff4e0', 0.9);
sun.castShadow = true; sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
scene.add(sun); scene.add(sun.target);
const itemsGroup = new THREE.Group(); scene.add(itemsGroup);
const overlay = new THREE.Group(); scene.add(overlay);
let needRender = true;
const requestRender = () => { needRender = true; };
controls.addEventListener('change', requestRender);

/* ---------------- nawierzchnie ---------------- */
const SURF = {
  trawa:   {name:'Trawnik', per:1, gen:(g,s,R)=>{ g.fillStyle='#6c9842'; g.fillRect(0,0,s,s); const n=s*s/5; for(let k=0;k<n;k++){ g.fillStyle=`hsl(${84+R()*18},${36+R()*16}%,${28+R()*16}%)`; g.fillRect(R()*s|0,R()*s|0,1+(R()*1.6|0),1+(R()*2|0)); } }},
  laka:    {name:'Łąka', per:1, gen:(g,s,R)=>{ g.fillStyle='#7f9b4a'; g.fillRect(0,0,s,s); for(let k=0;k<s*s/4;k++){ g.fillStyle=`hsl(${70+R()*30},${30+R()*20}%,${30+R()*20}%)`; g.fillRect(R()*s|0,R()*s|0,1,2); } const fl=['#f4f1e6','#e8c547','#a785c9','#d9656b']; for(let k=0;k<s*s/120;k++){ g.fillStyle=fl[R()*fl.length|0]; g.fillRect(R()*s|0,R()*s|0,2,2);} }},
  kostka:  {name:'Kostka szara', per:0.4, gen:(g,s,R,p)=>bricks(g,s,R,p,'#aaa59b','#7c786f')},
  kostka_g:{name:'Kostka grafit', per:0.4, gen:(g,s,R,p)=>bricks(g,s,R,p,'#5f6164','#3e4042')},
  kostka_c:{name:'Kostka czerwona', per:0.4, gen:(g,s,R,p)=>bricks(g,s,R,p,'#9a5a45','#6d4033')},

function buildSkirt(){

  let minH=Infinity; for(const h of S.heights) if(h<minH) minH=h;
  const base=minH-2.2, {nx,nz,step,W,D}=S, pos=[];
  const edge=(pts)=>{ for(let k=0;k<pts.length-1;k++){ const [x0,z0,h0]=pts[k],[x1,z1,h1]=pts[k+1]; pos.push(x0,h0,z0, x0,base,z0, x1,h1,z1,  x1,h1,z1, x0,base,z0, x1,base,z1); } };
  const N=[],Sx=[],E=[],Wl=[];
  for(let i=0;i<=nx;i++){ N.push([-W/2+i*step,-D/2,heightIdx(i,0)]); Sx.push([-W/2+i*step,D/2,heightIdx(i,nz)]); }
  for(let j=0;j<=nz;j++){ Wl.push([-W/2,-D/2+j*step,heightIdx(0,j)]); E.push([W/2,-D/2+j*step,heightIdx(nx,j)]); }

  const m=Math.max(W,D), R=m*14; ground.scale.set(R,R,1); ground.position.y=base-0.02;

let composeQueued=false;

function composeNow(){

  if(S.bg && bgImg && bgImg.complete){
    const b=S.bg, wpx=b.widthM*ppm, hpx=wpx*bgImg.naturalHeight/bgImg.naturalWidth;
    cctx.save(); cctx.globalAlpha=b.opacity; cctx.translate((S.W/2+b.offX)*ppm,(S.D/2+b.offZ)*ppm); cctx.rotate(b.rot*DEG); cctx.drawImage(bgImg,-wpx/2,-hpx/2,wpx,hpx); cctx.restore();
  }
  if(UI.grid){
    cctx.save(); cctx.lineWidth=1;
    for(let x=0;x<=S.W+0.001;x+=1){ cctx.strokeStyle= x%5===0?'rgba(255,255,255,.34)':'rgba(255,255,255,.13)'; cctx.beginPath(); cctx.moveTo(Math.round(x*ppm)+.5,0); cctx.lineTo(Math.round(x*ppm)+.5,comp.height); cctx.stroke(); }
    for(let z=0;z<=S.D+0.001;z+=1){ cctx.strokeStyle= z%5===0?'rgba(255,255,255,.34)':'rgba(255,255,255,.13)'; cctx.beginPath(); cctx.moveTo(0,Math.round(z*ppm)+.5); cctx.lineTo(comp.width,Math.round(z*ppm)+.5); cctx.stroke(); }

let stroke=null;
function softBegin(key){ const W=paint.width, H=paint.height, snap=pctx.getImageData(0,0,W,H), tc=surfTile(key);
  stroke={W,H,snap:snap.data,work:new ImageData(new Uint8ClampedArray(snap.data),W,H),mask:new Float32Array(W*H),td:tc.getContext('2d').getImageData(0,0,tc.width,tc.height).data,tw:tc.width,th:tc.height}; }

    for(let x=x0;x<=x1;x++){ const dx=(x+0.5-cx)*ir, d=Math.sqrt(dx*dx+dy*dy); if(d>=1) continue;

      const idx=y*S_.W+x; if(a<=M[idx]) continue; M[idx]=a; const i4=idx*4, t4=(ty+(x%tw))*4;
      w[i4]=s[i4]+(td[t4]-s[i4])*a; w[i4+1]=s[i4+1]+(td[t4+1]-s[i4+1])*a; w[i4+2]=s[i4+2]+(td[t4+2]-s[i4+2])*a; w[i4+3]=255; } }
  return [x0,y0,x1,y1]; }

  compose(); }

const MONTHS=['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
function sunPos(month, clock){
  const n=[17,47,75,105,135,162,198,228,258,288,318,344][month];
  const decl=23.44*Math.sin(2*Math.PI*(284+n)/365)*DEG, lat=52.2*DEG;
  const dst = month>=3 && month<=9;
  const solar = clock-(dst?2:1)+21/15;
  const H=(solar-12)*15*DEG;
  const el=Math.asin(Math.sin(lat)*Math.sin(decl)+Math.cos(lat)*Math.cos(decl)*Math.cos(H));
  const A=Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(lat)-Math.tan(decl)*Math.cos(lat));
  return {el, A, v:new THREE.Vector3(-Math.sin(A)*Math.cos(el), Math.sin(el), Math.cos(A)*Math.cos(el))};
}
function fitSun(){
  const R=Math.max(S.W,S.D)*0.8+12, c=sun.shadow.camera;
  c.left=-R; c.right=R; c.top=R; c.bottom=-R; c.near=1; c.far=R*5; c.updateProjectionMatrix(); updateSun();
}
function updateSun(){
  const p=sunPos(UI.month, UI.hour), R=Math.max(S.W,S.D)*0.8+12;
  const up=Math.max(p.el, -0.05);
  const dir=p.v.clone(); if(dir.y<0.02){ dir.y=0.02; dir.normalize(); }
  sun.position.copy(dir.multiplyScalar(R*2.2)); sun.target.position.set(0,0,0);
  const day=clamp(Math.sin(up)*2.2,0,1);
  sun.intensity = p.el>0 ? 0.25+0.75*Math.pow(Math.sin(p.el),0.45) : 0.05;
  sun.color.set(new THREE.Color('#ffb36b').lerp(new THREE.Color('#fff5e6'), day));
  hemi.intensity = 0.25+0.35*day;
  const sky=new THREE.Color(p.el>0?'#e9b78f':'#27324a').lerp(new THREE.Color('#b8d1e6'), day);
  scene.background.copy(sky); scene.fog.color.copy(sky);
  sun.castShadow = UI.shadows && p.el>0;
  const hh=Math.floor(UI.hour), mm=Math.round((UI.hour-hh)*60);
  $('#hourOut').textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  $('#sunOut').textContent = p.el>0 ? `słońce ${Math.round(p.el/DEG)}°` : 'po zachodzie';
  requestRender();
}

function drapePts(pts, closed, lift){
  const out=[], P=closed?[...pts,pts[0]]:pts;
  for(let k=0;k<P.length-1;k++){ const a=P[k], b=P[k+1], L=Math.hypot(b.x-a.x,b.z-a.z), n=Math.max(1,Math.ceil(L/(S.step/2)));
    for(let s=0;s<n;s++){ const f=s/n, x=a.x+(b.x-a.x)*f, z=a.z+(b.z-a.z)*f; out.push(x,heightAt(x,z)+lift,z); } }
  const l=P[P.length-1]; if(l) out.push(l.x,heightAt(l.x,l.z)+lift,l.z);
  return out;
}

let brush=null;
function applyBrush(){
  if(!brush || !brush.p) return;
  const {x,z}=brush.p, r=UI.radius, st=UI.strength, mode=UI.terrainMode, {nx,nz,step,W,D}=S;
  const i0=Math.max(0,Math.floor((x-r+W/2)/step)), i1=Math.min(nx,Math.ceil((x+r+W/2)/step)), j0=Math.max(0,Math.floor((z-r+D/2)/step)), j1=Math.min(nz,Math.ceil((z+r+D/2)/step));
  const H=S.heights, src=mode==='smooth'?H.slice():null;
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
    const px=-W/2+i*step, pz=-D/2+j*step, dd=Math.hypot(px-x,pz-z); if(dd>r) continue;

    else if(mode==='lower') H[k]-=0.06*st*f;
    else if(mode==='smooth'){ let s=0,c=0; for(let b=-1;b<=1;b++) for(let a=-1;a<=1;a++){ const ii=i+a, jj=j+b; if(ii<0||jj<0||ii>nx||jj>nz) continue; s+=src[jj*(nx+1)+ii]; c++; } H[k]+=(s/c-H[k])*f*st*0.6; }
    else { const tgt= mode==='flatten'? brush.target : UI.setH; H[k]+=(tgt-H[k])*Math.min(1,f*st*0.5+ (f>0.6?0.15:0)); }

}
function flattenUnder(it){
  ensureBM(it); const base=itemY(it), {nx,nz,step,W,D}=S, m=0.4, ring_=1.6, fp=addBlocks(it).filter(b=>b.y0<0.05);
  for(let j=0;j<=nz;j++) for(let i=0;i<=nx;i++){
    const l=toLocal(it,-W/2+i*step,-D/2+j*step); let dd=Infinity;
    for(const wg of fp){ const ex=Math.max(0,Math.abs(l.x-wg.x)-wg.w/2-m), ez=Math.max(0,Math.abs(l.z-wg.z)-wg.d/2-m); dd=Math.min(dd,Math.hypot(ex,ez)); }

}

function enterWalk(){

  camera.position.set(walk.pos.x-f.x*6, heightAt(walk.pos.x,walk.pos.z)+8, walk.pos.z-f.z*6); controls.update();

function updateWalk(dt){
  const k=walk.keys, sp=(k.ShiftLeft||k.ShiftRight?7:2.8)*dt;
  const f=new THREE.Vector3(-Math.sin(walk.yaw),0,-Math.cos(walk.yaw)), r=new THREE.Vector3(Math.cos(walk.yaw),0,-Math.sin(walk.yaw));
  if(k.KeyW||k.ArrowUp) walk.pos.addScaledVector(f,sp);
  if(k.KeyS||k.ArrowDown) walk.pos.addScaledVector(f,-sp);
  if(k.KeyA) walk.pos.addScaledVector(r,-sp);
  if(k.KeyD) walk.pos.addScaledVector(r,sp);
  if(k.ArrowLeft) walk.yaw+=1.6*dt; if(k.ArrowRight) walk.yaw-=1.6*dt;
  walk.pos.x=clamp(walk.pos.x,-S.W/2-15,S.W/2+15); walk.pos.z=clamp(walk.pos.z,-S.D/2-15,S.D/2+15);
  const inside=Math.abs(walk.pos.x)<=S.W/2&&Math.abs(walk.pos.z)<=S.D/2;
  camera.position.set(walk.pos.x, (inside?heightAt(walk.pos.x,walk.pos.z):ground.position.y)+1.65, walk.pos.z);
  camera.rotation.set(walk.pitch, walk.yaw, 0, 'YXZ');
}
document.querySelectorAll('#walkpad button[data-k]').forEach(b=>{ const k=b.dataset.k; b.addEventListener('pointerdown',e=>{e.preventDefault(); walk.keys[k]=true;}); for(const ev of ['pointerup','pointerleave','pointercancel']) b.addEventListener(ev,()=>walk.keys[k]=false); });
$('#walkExit').addEventListener('click', exitWalk);
document.addEventListener('mousemove', e=>{ if(walk.on && document.pointerLockElement===renderer.domElement){ walk.yaw-=e.movementX*0.0024; walk.pitch=clamp(walk.pitch-e.movementY*0.0024,-1.35,1.35); requestRender(); } });

/* ---------------- klawiatura ---------------- */
window.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') return;
  if(EM.on && !walk.on){ if(emKey(e)) return; }
  if(walk.on){ walk.keys[e.code]=true; if(e.code==='Escape') exitWalk(); if(e.code.startsWith('Arrow')||e.code==='Space') e.preventDefault(); return; }
  if((e.ctrlKey||e.metaKey) && e.code==='KeyZ'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey) && e.code==='KeyY'){ e.preventDefault(); redo(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const it=getSel();
  if(e.code==='Escape'){ if(linePts.length){ cancelLine(); } else if(poly.pts.length){ cancelPoly(); } else if(pathPts.length){ pathPts=[]; setLine(prevLine,[]); } else if(UI.tool!=='select') setTool('select'); else select(null); return; }
  if(e.code==='Enter'){ if(linePts.length){ finishLine(); return; } if(UI.tool==='paint'&&UI.paintMode==='poly'){ poly.closed?commitPoly():closePoly(); return; } if(UI.tool==='paint'&&UI.paintMode==='path') finishPath(); if(UI.tool==='boundary') closeBoundary(); return; }
  if((e.code==='Delete'||e.code==='Backspace') && poly.closed && poly.last>=0 && poly.pts.length>3){ e.preventDefault(); poly.pts.splice(poly.last,1); poly.last=-1; rebuildPoly(); renderPanel(); return; }
  if((e.code==='Delete'||e.code==='Backspace') && it && isGS(it) && it.pts && gsLast>=0 && gsLast<it.pts.length){ e.preventDefault(); if(it.pts.length>(it.closed?3:2)){ pushUndo(); it.pts.splice(gsLast,1); gsLast=-1; rebuildItem(it); renderPanel(); } else toast('To już najmniejsza liczba punktów'); return; }
  if((e.code==='Delete'||e.code==='Backspace') && it){ e.preventDefault(); deleteSel(); return; }
  if(e.code==='KeyQ'||e.code==='KeyE'){ const d=e.code==='KeyQ'?-15:15; if(it){ pushUndo(); it.rot=((it.rot||0)+d+360)%360; moveItem(it); renderPanel(); } else if(ghost){ ghostRot=(ghostRot+d+360)%360; ghost.rotation.y=-ghostRot*DEG; requestRender(); } return; }
  if(e.code==='KeyD' && it){ dupSel(); return; }
  const map={KeyV:'select',KeyT:'terrain',KeyN:'paint',KeyR:'plants',KeyO:'objects',KeyB:'buildings',KeyG:'boundary',KeyM:'measure'};
  if(map[e.code]) setTool(map[e.code]);
});
window.addEventListener('keyup', e=>{ walk.keys[e.code]=false; });
window.addEventListener('blur', ()=>{ walk.keys={}; });
function deleteSel(){ const it=getSel(); if(!it) return; pushUndo(); S.items=S.items.filter(i=>i!==it); const o=objOf.get(it.id); if(o){ itemsGroup.remove(o); disposeObj(o); objOf.delete(it.id);} select(null); markDirty(); }
function dupSel(){ const it=getSel(); if(!it) return; pushUndo(); const c=JSON.parse(JSON.stringify(it)); c.id=S.nextId++; c.x+=1.5; c.z+=1.5; c.seed=(Math.random()*1e9)|0; S.items.push(c); addItemMesh(c); select(c.id); markDirty(); }

const TOOLS=[['select','Wybierz'],['terrain','Teren'],['paint','Nawierzchnie'],['plants','Rośliny'],['objects','Obiekty'],['buildings','Budynki'],['sep'],['boundary','Granica'],['measure','Miarka'],['bg','Podkład'],['project','Projekt']];
$('#rail').innerHTML = TOOLS.map(([k,n])=> k==='sep'?'<div class="sep"></div>':`<button data-tool="${k}" title="${n}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${n}</button>`).join('');
$('#rail').addEventListener('click', e=>{ const b=e.target.closest('button[data-tool]'); if(b) setTool(b.dataset.tool); });
function setTool(t){
  if(EM.on){ toast('Najpierw zakończ edycję budynku (Gotowe)'); return; }
  if(pathPts.length) { pathPts=[]; setLine(prevLine,[]); }
  linePts=[]; if(poly.pts.length){ poly.pts=[]; poly.closed=false; poly.last=-1; rebuildPoly(); }
  if(t!=='measure'){ /* zostaw pomiar widoczny */ }
  setLine(prevLine,[]); ringAt(null);
  if(UI.tool!==t && ['plants','objects','buildings'].includes(t)){ const cur=UI.placeType; const grp = cur? (cur.startsWith('b:')?'buildings':CAT[cur]?.g) : null; if(grp!==t) UI.placeType=null; }
  UI.tool=t; if(t!=='select' && UI.sel && !['select'].includes(t)) { UI.sel=null; updSelBox(); }
  document.querySelectorAll('#rail button').forEach(b=>b.classList.toggle('on', b.dataset.tool===t));
  setGhost(); renderPanel(); updHint();
  $('#panel').classList.remove('collapsed');
}
function updHint(){
  const H={
    select:'Kliknij obiekt, by go zaznaczyć, i przeciągnij, by przesunąć. Prawy przycisk obraca widok, środkowy przesuwa, kółko przybliża.',
    terrain:'Maluj po terenie, by go kształtować. Prawy przycisk obraca widok, kółko przybliża.',
    paint: UI.paintMode==='poly'?(poly.closed?'Przeciągaj pomarańczowe punkty. Biała kropka na boku dodaje punkt, Delete usuwa ostatnio ruszony. Enter wypełnia.':'Klikaj wierzchołki kształtu. Kliknięcie pierwszego punktu, Enter lub dwuklik zamyka obrys.'):UI.paintMode==='path'?'Klikaj kolejne punkty ścieżki. Enter lub dwuklik kończy.':UI.paintMode==='rect'?'Przeciągnij, by wypełnić prostokąt.':'Maluj nawierzchnię po terenie.',
    plants:'Wybierz roślinę z panelu i klikaj na terenie. Q / E obraca przed postawieniem.',
    objects:'Wybierz obiekt z panelu i klikaj na terenie. Ogrodzenie, bramę i murek rysujesz linią: klikaj kolejne punkty.',
    buildings:'Wybierz budynek i kliknij, gdzie ma stanąć. Wymiary zmienisz po zaznaczeniu.',
    boundary:'Klikaj narożniki działki. Kliknięcie pierwszego punktu, Enter lub dwuklik zamyka obrys.',
    measure:'Kliknij dwa punkty, by zmierzyć odległość.',
    bg:'Wgraj zrzut z Geoportalu i dopasuj go do skali.',
    project:'Zapis, wczytywanie i nowa działka.',
  };
  if(EM.on){ $('#hint span').textContent=emHelp(); return; }
  const bh=null;
  const s = bh ? bh : walk.on ? 'Spacer: kliknij w scenę, a potem rozglądaj się ruchem myszy. W A S D lub strzałki chodzą, Shift przyspiesza. Esc puszcza mysz, drugi Esc kończy spacer.' : (linePts.length?'Klikaj kolejne punkty linii. Enter lub dwuklik kończy, kliknięcie pierwszego punktu zamyka obwód, Esc anuluje.':H[UI.tool]);
  $('#hint span').textContent=s;
}

const panelInner=$('#panelInner');
let pendingUndo=false;
panelInner.addEventListener('pointerdown',()=>{ pendingUndo=true; });
panelInner.addEventListener('focusin',()=>{ pendingUndo=true; });
function pu(){ if(pendingUndo){ pushUndo(); pendingUndo=false; } }
const on=(id,ev,fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener(ev,fn); };
function rangeF(id,label,val,min,max,step,out){ return `<div class="field"><label for="${id}">${label}<output id="${id}_o">${out}</output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`; }
function numF(id,label,val,step,min,max){ return `<div class="field"><label for="${id}">${label}</label><input type="number" id="${id}" value="${val}" step="${step||0.1}" ${min!=null?`min="${min}"`:''} ${max!=null?`max="${max}"`:''}></div>`; }
function segF(id,opts,cur){ return `<div class="seg" id="${id}" style="width:100%">${opts.map(([k,n])=>`<button data-v="${k}" class="${k===cur?'on':''}" style="flex:1">${n}</button>`).join('')}</div>`; }
function bindSeg(id,fn){ const el=document.getElementById(id); if(!el) return; el.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); fn(b.dataset.v); }); }
function armBtn(id, fn){ const el=document.getElementById(id); if(!el) return; let t=null; const label=el.textContent; el.addEventListener('click',()=>{ if(el.classList.contains('armed')){ clearTimeout(t); el.classList.remove('armed'); el.textContent=label; fn(); } else { el.classList.add('armed'); el.textContent='Kliknij ponownie, by potwierdzić'; t=setTimeout(()=>{ el.classList.remove('armed'); el.textContent=label; },3500); } }); }

const thumbCache={}; let thumbR=null, thumbScene=null, thumbCam=null;
function thumb(key){
  if(thumbCache[key]) return thumbCache[key];
  try{
    if(!thumbR){ thumbR=new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true}); thumbR.setPixelRatio(1); thumbR.setSize(192,144,false);
      thumbScene=new THREE.Scene(); thumbScene.add(new THREE.HemisphereLight('#eef4fa','#6a6650',0.75)); const dl=new THREE.DirectionalLight('#fff6e8',0.85); dl.position.set(6,9,7); thumbScene.add(dl); thumbCam=new THREE.PerspectiveCamera(28,4/3,0.05,1000); }
    const nid=S.nextId; const it= key.startsWith('b:')? newItem('budynek',0,0,{preset:key.slice(2)}) : newItem(key,0,0); S.nextId=nid;
    it.seed=11; if(it.len) it.len=Math.min(it.len, key==='basen'?6:3.5);
    const o=buildItem(it); thumbScene.add(o);
    const b=new THREE.Box3().setFromObject(o), c=b.getCenter(new THREE.Vector3()), R=b.getSize(new THREE.Vector3()).length()/2;
    const dir=new THREE.Vector3(1,0.7,1.35).normalize(); thumbCam.position.copy(c).addScaledVector(dir, R/Math.tan(14*DEG)*0.82); thumbCam.lookAt(c);
    thumbR.render(thumbScene,thumbCam); thumbCache[key]=thumbR.domElement.toDataURL('image/png');
    thumbScene.remove(o); disposeObj(o);
  }catch(_){ thumbCache[key]=''; }
  return thumbCache[key];
}

function readImage(file, maxDim, cb){
  if(!file) return; const fr=new FileReader();
  fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,maxDim/Math.max(img.width,img.height)); const c=mkCanvas(Math.round(img.width*k),Math.round(img.height*k)); c.getContext('2d').drawImage(img,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',0.86), c.width, c.height); }; img.onerror=()=>toast('Nie udało się odczytać tego obrazu. Spróbuj pliku JPG lub PNG.'); img.src=fr.result; };
  fr.readAsDataURL(file);
}
function loadTex(file, cb){ readImage(file, 1024, url=>{ const id='t'+Date.now().toString(36); S.textures[id]=url; cb(id); markDirty(); }); }
function loadBg(file){ readImage(file, 2400, (url,w,h)=>{ const keep=S.bg; S.bg={src:url, widthM:keep?keep.widthM:+(S.W*1.1).toFixed(1), offX:keep?keep.offX:0, offZ:keep?keep.offZ:0, rot:keep?keep.rot:0, opacity:keep?keep.opacity:0.8}; setBgImg(url); renderPanel(); markDirty(); }); }

async function deserialize(o){
